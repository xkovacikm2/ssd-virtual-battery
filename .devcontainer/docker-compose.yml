version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../:/workspace/ssd-virtual-battery:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ssd_virtual_battery_development?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/ssd_virtual_battery_test?sslmode=disable
      E2E_DATABASE_URL: postgres://postgres:postgres@db:5432/ssd_virtual_battery_e2e?sslmode=disable
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ssd_virtual_battery_development
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:

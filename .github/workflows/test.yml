name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ssd_virtual_battery_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Go tests
        env:
          GOFLAGS: -mod=mod
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ssd_virtual_battery_test?sslmode=disable
        run: go test ./internal/...

  web-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run unit tests
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ssd_virtual_battery_e2e
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ssd_virtual_battery_e2e?sslmode=disable
      GOFLAGS: -mod=mod

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Install e2e dependencies
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run e2e parity suite
        run: npx playwright test
        working-directory: e2e

      - name: Keep Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: e2e/test-results
          if-no-files-found: ignore

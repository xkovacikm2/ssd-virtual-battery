name: Lint

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Build frontend for go:embed
        run: npm ci && npm run build
        working-directory: web

      - name: golangci-lint
        env:
          GOFLAGS: -mod=mod
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...

  lint-ts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Typecheck frontend
        run: npm ci && npm run typecheck
        working-directory: web

      - name: Typecheck e2e suite
        run: npm ci && npx tsc -p .
        working-directory: e2e

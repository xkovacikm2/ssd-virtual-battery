name: Security Scan

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  scan_go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Scan Go dependencies for known vulnerabilities
        env:
          GOFLAGS: -mod=mod
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./internal/...

  scan_web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Audit frontend dependencies
        run: npm audit --omit=dev
        working-directory: web
